<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrolabio planisferico</title>
  <!-- I caratteri da Google Fonts: Spectral per i titoli, Atkinson Hyperlegible per il testo -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral:wght@400;600&display=swap">
  <!-- Il foglio di stile: lo stesso nome del file stile.css nella stessa cartella -->
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <article class="scheda">

    <!-- Prima colonna: l'immagine con la didascalia -->
    <figure class="miniatura">
      <img src="immagini/astrolabio.svg"
           alt="Astrolabio in ottone visto di fronte, con la rete traforata">
      <figcaption>Astrolabio planisferico. Disegno creato per l'esempio, CC0 1.0</figcaption>
    </figure>

    <!-- Seconda colonna: il testo della scheda -->
    <div class="testo">
      <h1>Astrolabio planisferico</h1>
      <p class="autore">Officina veneziana, metà del XVI secolo</p>
      <p>Strumento con madre, tre timpani e rete</p>
      <dl>
        <dt>Tipologia</dt> <dd>Strumento scientifico</dd>
        <dt>Luogo</dt> <dd>Venezia</dd>
        <dt>Materia</dt> <dd>Ottone fuso e inciso</dd>
      </dl>
      <a href="https://catalogo.beniculturali.it/viewAll/CulturalInstituteOrSite?refineQ=venezia&amp;region=VENETO">Altri oggetti da Venezia nel catalogo ICCD</a>
    </div>

  </article>
</body>
</html>
