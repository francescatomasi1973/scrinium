<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrinium, catalogo di patrimonio e testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --sunk:#E2E6E0; --ink:#1D2420; --muted:#56605B; --rule:#C6CDC6;
  --verde:#2A685A; --lapis:#2D4889; --contrib:#8A3849; --ocra:#A4761A; --mark:#F1D57E; --mark-ink:#1D2420;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131816; --surface:#1B211E; --sunk:#232B27; --ink:#E2E7E1; --muted:#9BA69F; --rule:#34403A;
    --verde:#72B5A3; --lapis:#93A9E2; --contrib:#DD8C9C; --ocra:#D8B25C; --mark:#7C6420; --mark-ink:#F5F1E3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1B211E; --sunk:#232B27; --ink:#E2E7E1; --muted:#9BA69F; --rule:#34403A;
  --verde:#72B5A3; --lapis:#93A9E2; --contrib:#DD8C9C; --ocra:#D8B25C; --mark:#7C6420; --mark-ink:#F5F1E3; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px;border-radius:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,4vw,2.9rem);letter-spacing:-.01em}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:0 0 1em}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .08em;border-radius:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.lede{font-family:var(--serif);font-size:1.2rem;line-height:1.6;max-width:64ch;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.site-head .wrap{display:flex;align-items:center;gap:24px;min-height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex-shrink:0}
.brand b{font-family:var(--serif);font-size:1.55rem;font-weight:600;letter-spacing:.01em}
.brand span{font-size:.85rem;color:var(--muted)}
.nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.nav a{text-decoration:none;padding:8px 12px;border-radius:6px;white-space:nowrap;color:var(--muted)}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);border-radius:0}
.theme-btn{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;flex-shrink:0}
@media (max-width:760px){.brand span{display:none}.site-head .wrap{gap:10px}}

main{min-height:70vh;padding-bottom:64px}
.page{padding-top:40px}

/* buttons & form */
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;padding:10px 18px;border-radius:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:hover{filter:brightness(1.12)}
input[type=search],input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:6px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--lapis);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--lapis) 25%,transparent)}
label{font-weight:700;font-size:.95rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field .hint{font-size:.85rem;color:var(--muted);font-weight:400}
.field .err{font-size:.85rem;color:var(--contrib);font-weight:700}

/* collection markers */
.coll{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.coll::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--verde))}
.k-oggetto{--c:var(--verde)}
.k-testo{--c:var(--lapis)}
.k-contrib{--c:var(--contrib)}

/* HOME */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);padding:56px 0 48px;align-items:start}
.verse{border-left:3px solid var(--lapis);padding-left:clamp(16px,3vw,32px)}
.verse .lines{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(1.7rem,3.9vw,3.2rem);line-height:1.25;margin:0 0 18px}
.verse .lines a.w{text-decoration:none;border-radius:3px;transition:background .15s}
.verse .lines a.w:hover,.verse .lines a.w:focus-visible{background:var(--mark);color:var(--mark-ink)}
.verse .attr{font-size:.95rem;color:var(--muted)}
.verse .attr a{color:var(--ink)}
.verse .how{margin-top:28px;font-size:.95rem;color:var(--muted);max-width:46ch}
.hero-side h1{font-size:clamp(1.9rem,3vw,2.5rem)}
.bigsearch{display:flex;gap:8px;margin:20px 0 28px}
.bigsearch input{font-size:1.1rem;padding:12px 14px}
.colls{display:grid;gap:12px}
.coll-entry{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;text-decoration:none;padding:16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.coll-entry:hover{border-color:var(--c)}
.coll-entry .n{grid-row:span 2;font-family:var(--serif);font-size:2.4rem;line-height:1;color:var(--c);min-width:2ch}
.coll-entry strong{font-size:1.05rem}
.coll-entry span{font-size:.9rem;color:var(--muted)}
.strata{padding:32px 0;border-top:1px solid var(--rule)}
.strata-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;padding:32px 0;border-top:1px solid var(--rule)}
.paths a{display:block;text-decoration:none;padding:18px 0;border-bottom:1px solid var(--rule)}
.paths a strong{font-family:var(--serif);font-size:1.35rem;font-weight:600;display:block}
.paths a span{color:var(--muted)}
.paths a:hover strong{text-decoration:underline;text-underline-offset:4px}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:32px}.paths{grid-template-columns:1fr}}

/* CATALOGO */
.cat-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;margin-bottom:24px}
.cat-head>div:first-child{flex:1 1 320px}
.cat-search{flex:1 1 380px;display:flex;gap:8px}
.cat-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;align-items:start}
.facets{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
.facet{border-top:1px solid var(--rule);padding:12px 0}
.facet h3{font-family:var(--sans);font-size:.95rem;font-weight:700;margin:0 0 8px}
.facet ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
.facet li label{display:flex;align-items:center;gap:8px;font-weight:400;font-size:.93rem;padding:3px 0;cursor:pointer}
.facet li label .ct{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.facet li label.zero{opacity:.45}
.facet input[type=checkbox]{accent-color:var(--lapis);width:16px;height:16px}
.range{display:flex;gap:8px;align-items:center}
.range input{padding:6px 8px}
.filter-toggle{display:none}
.results-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.results-bar .count{font-family:var(--serif);font-size:1.3rem}
.results-bar .ctrls{display:flex;gap:8px;align-items:center}
.results-bar select{width:auto;padding:6px 10px}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;background:transparent;color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.85rem;background:var(--sunk);border:0;border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.chip b{font-weight:400;color:var(--muted)}
.chip:hover{text-decoration:line-through}
.hist{display:flex;align-items:flex-end;gap:3px;height:92px;padding:8px 0 0;margin-bottom:6px;border-bottom:1px solid var(--rule)}
.hist button{flex:1;display:flex;flex-direction:column-reverse;justify-content:flex-start;height:100%;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.hist button .seg-o{background:var(--verde)}
.hist button .seg-t{background:var(--lapis)}
.hist button .seg-c{background:var(--contrib)}
.hist button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.hist button:hover{opacity:.8}
.hist-labels{display:flex;gap:3px;margin-bottom:22px}
.hist-labels span{flex:1;text-align:center;font-size:.7rem;color:var(--muted);min-width:0;overflow:hidden}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px}
.card .thumb{display:block;aspect-ratio:4/3;border-radius:6px;overflow:hidden;margin-bottom:10px}
.card h3{font-size:1.12rem;margin:4px 0 2px}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.card p{margin:0;font-size:.92rem;color:var(--muted)}
.card .snip{margin-top:8px;font-family:var(--serif);font-size:.98rem;color:var(--ink);font-style:italic}
.thumb-svg{width:100%;height:100%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--c)}
.thumb-svg svg{width:58%;height:auto}
.incipit{width:100%;height:100%;padding:18px;display:flex;align-items:flex-end;background:color-mix(in srgb,var(--c) 13%,var(--surface));font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.3;color:var(--ink)}
.incipit span{border-left:2px solid var(--c);padding-left:10px}
.empty{padding:48px 24px;text-align:center;border:1.5px dashed var(--rule);border-radius:8px}
.empty h3{margin-bottom:6px}
table.data{width:100%;border-collapse:collapse;font-size:.93rem}
table.data th,table.data td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.data th{font-weight:700;background:var(--surface);position:sticky;top:0}
table.data th button{font:inherit;font-weight:700;background:none;border:0;color:inherit;cursor:pointer;padding:0}
table.data tbody tr:hover{background:var(--surface)}
table.data td.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll-x{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
@media (max-width:900px){
  .cat-grid{grid-template-columns:1fr}
  .facets{position:static;max-height:none;display:none;padding:0 0 12px}
  .facets.open{display:block}
  .filter-toggle{display:inline-flex}
}

/* RECORD */
.crumbs{font-size:.9rem;color:var(--muted);margin-bottom:18px}
.crumbs a{color:var(--muted)}
.rec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,4vw,56px)}
.rec .thumb{aspect-ratio:1/1;border-radius:8px;overflow:hidden}
.rec .desc{font-family:var(--serif);font-size:1.18rem;line-height:1.6;max-width:62ch}
dl.meta{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:0;margin:20px 0;border-top:1px solid var(--rule)}
dl.meta dt,dl.meta dd{padding:9px 0;border-bottom:1px solid var(--rule);margin:0}
dl.meta dt{color:var(--muted);padding-right:20px;font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:20px;padding:3px 10px}
.tag:hover{border-color:var(--ink)}
.cite{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:.9rem}
.related{margin-top:48px;padding-top:24px;border-top:1px solid var(--rule)}
@media (max-width:860px){.rec{grid-template-columns:1fr}}

/* READER */
.reader-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.reader-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 24px;padding:12px;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.reader-tools input[type=search]{flex:1 1 200px;width:auto}
.reader-tools .found{font-size:.9rem;color:var(--muted)}
.reader{font-family:var(--serif);font-size:1.25rem;line-height:1.75;max-width:62ch}
.reader .ln{display:grid;grid-template-columns:3.2ch 1fr;gap:12px}
.reader .ln i{font-style:normal;font-family:var(--sans);font-size:.75rem;color:var(--muted);text-align:right;padding-top:.55em;user-select:none}
.reader.nonum .ln i{visibility:hidden}
.reader .stanza{height:.9em}
.reader p.prose{text-indent:1.5em;margin:0 0 .8em;text-align:justify;hyphens:auto}
.side-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.side-panel h3{font-family:var(--sans);font-size:1rem;margin-top:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px}
.stats b{display:block;font-family:var(--serif);font-size:1.5rem;font-weight:600}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:900px){.reader-grid{grid-template-columns:1fr}.side-panel{position:static}}

/* bars */
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 3ch;gap:10px;align-items:center;font-size:.9rem;text-decoration:none;background:none;border:0;color:inherit;font:inherit;font-size:.9rem;text-align:left;padding:2px 0;cursor:pointer}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.bar .track i{display:block;height:100%}
.bar .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar:hover .lab{text-decoration:underline}

/* ESPLORA */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:24px 0 28px;overflow-x:auto}
.tabs a{text-decoration:none;padding:10px 14px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.viz-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:900px){.viz-grid{grid-template-columns:1fr}}
.viz-svg{width:100%;height:auto;display:block}
.viz-svg text{font-family:var(--sans);fill:var(--muted)}
.viz-svg .axis{stroke:var(--rule)}
.viz-svg .land{fill:var(--sunk);stroke:var(--rule);stroke-width:1}
.viz-svg a circle,.viz-svg a path{cursor:pointer}
.viz-svg a:hover circle,.viz-svg a:hover path{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.88rem;color:var(--muted);margin:10px 0}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-family:var(--serif)}
.cloud a{text-decoration:none;line-height:1.2}
.cloud a:hover{text-decoration:underline}
.kwic{font-family:var(--serif);font-size:1.02rem}
.kwic td.l{text-align:right;white-space:nowrap;overflow:hidden;max-width:0;width:42%;direction:rtl}
.kwic td.l span{direction:ltr;unicode-bidi:bidi-override}
.kwic td.k{text-align:center;white-space:nowrap;width:1%}
.kwic td.r{white-space:nowrap;overflow:hidden;max-width:0;width:42%}
.kwic td.src{font-family:var(--sans);font-size:.82rem;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:20px}
.opts label{font-weight:400;display:flex;gap:6px;align-items:center}

/* DATASET */
.ds-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;margin-bottom:36px}
@media (max-width:860px){.ds-head{grid-template-columns:1fr}}
.compl{display:flex;align-items:center;gap:8px;min-width:120px}
.compl .track{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.compl .track i{display:block;height:100%;background:var(--ink)}
.compl span{font-size:.85rem;font-variant-numeric:tabular-nums;width:4ch;text-align:right}
.req{font-size:.8rem;border:1px solid var(--rule);border-radius:10px;padding:1px 7px;white-space:nowrap}
.req.y{border-color:var(--ink)}
.section{margin-top:48px}
.section>h2{margin-bottom:6px}
.section>p{max-width:72ch}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:.9rem}
textarea.export{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;min-height:220px}

/* CONTRIBUISCI */
.contrib-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
fieldset{border:0;border-top:1px solid var(--rule);padding:20px 0 4px;margin:0}
legend{font-family:var(--serif);font-size:1.3rem;font-weight:600;padding:0 12px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.radio-cards label{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;font-weight:400}
.radio-cards label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.radio-cards input{accent-color:var(--ink);margin-top:4px}
.radio-cards strong{display:block}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.preview pre{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px;font-size:.78rem;overflow:auto;max-height:300px;white-space:pre-wrap}
.mine li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule)}
@media (max-width:900px){.contrib-grid{grid-template-columns:1fr}.preview{position:static}.two,.radio-cards{grid-template-columns:1fr}}

/* tooltip & toast */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.85rem;padding:6px 10px;border-radius:5px;max-width:260px;opacity:0;transition:opacity .1s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;opacity:0;transition:all .2s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* collegamenti */
.links-sec{margin-top:48px;padding-top:24px;border-top:1px solid var(--rule);max-width:860px}
.links{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:14px}
.link-item{border-left:4px solid var(--lc);padding:4px 0 4px 16px}
.link-item p{margin:0 0 4px}
.lrel{font-size:1.02rem}
.lt{font-weight:700;color:var(--ink)}
.lnote{font-family:var(--serif);font-size:1.05rem;max-width:68ch}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--contrib);text-decoration:underline;cursor:pointer;padding:0 0 0 8px}
.ltleg{display:inline-flex;align-items:center;gap:8px;font-size:.88rem}

{id:"TXT-0001",titolo:"Inferno, canto I (vv. 1–12)",autore:"Dante Alighieri",anno:1307,datazione:"1304–1308 circa",luogo:"Firenze",tipologia:"Poema",forma:"Terzine di endecasillabi",soggetti:["viaggio","allegoria","smarrimento"],licenza:"Pubblico dominio",verso:true,
descrizione:"L’apertura della Commedia: il poeta si ritrova in una selva oscura a metà del cammino della vita.",
testo:`Nel mezzo del cammin di nostra vita
mi ritrovai per una selva oscura,
ché la diritta via era smarrita.

Ahi quanto a dir qual era è cosa dura
esta selva selvaggia e aspra e forte
che nel pensier rinova la paura!

Tant' è amara che poco è più morte;
ma per trattar del ben ch'i' vi trovai,
dirò de l'altre cose ch'i' v'ho scorte.

Io non so ben ridir com' i' v'intrai,
tant' era pien di sonno a quel punto
che la verace via abbandonai.`},
{id:"TXT-0002",titolo:"Rerum vulgarium fragmenta, 1",autore:"Francesco Petrarca",anno:1374,datazione:"redazione finale 1374",luogo:"Arezzo",tipologia:"Lirica",forma:"Sonetto",soggetti:["amore","pentimento","tempo"],licenza:"Pubblico dominio",verso:true,
descrizione:"Sonetto proemiale del Canzoniere: il poeta si rivolge ai lettori e giudica il proprio giovanile errore.",
testo:`Voi ch'ascoltate in rime sparse il suono
di quei sospiri ond'io nudriva 'l core
in sul mio primo giovenile errore
quand'era in parte altr'uom da quel ch'i' sono,

del vario stile in ch'io piango et ragiono
fra le vane speranze e 'l van dolore,
ove sia chi per prova intenda amore,
spero trovar pietà, nonché perdono.

Ma ben veggio or sì come al popol tutto
favola fui gran tempo, onde sovente
di me medesmo meco mi vergogno;

et del mio vaneggiar vergogna è 'l frutto,
e 'l pentersi, e 'l conoscer chiaramente
che quanto piace al mondo è breve sogno.`},
{id:"TXT-0003",titolo:"Il Principe, dedica (incipit)",autore:"Niccolò Machiavelli",anno:1513,datazione:"1513",luogo:"Firenze",tipologia:"Trattato",forma:"Prosa",soggetti:["politica","principato","dono"],licenza:"Pubblico dominio",verso:false,
descrizione:"Esordio della lettera dedicatoria a Lorenzo de’ Medici.",
testo:`Sogliono, el più delle volte, coloro che desiderano acquistare grazia appresso uno Principe, farsi loro incontro con quelle cose che infra le loro abbino più care, o delle quali vegghino lui più delettarsi; donde si vede molte volte essere loro presentati cavalli, arme, drappi d'oro, pietre preziose e simili ornamenti degni della grandezza di quelli.`},
{id:"TXT-0004",titolo:"Orlando furioso, canto I, ottava 1",autore:"Ludovico Ariosto",anno:1532,datazione:"edizione definitiva 1532",luogo:"Ferrara",tipologia:"Poema",forma:"Ottava rima",soggetti:["cavalleria","amore","guerra"],licenza:"Pubblico dominio",verso:true,
descrizione:"Protasi del poema: le donne, i cavalieri, le armi e gli amori al tempo della guerra tra Mori e Franchi.",
testo:`Le donne, i cavallier, l'arme, gli amori,
le cortesie, l'audaci imprese io canto,
che furo al tempo che passaro i Mori
d'Africa il mare, e in Francia nocquer tanto,
seguendo l'ire e i giovenil furori
d'Agramante lor re, che si diè vanto
di vendicar la morte di Troiano
sopra re Carlo imperator romano.`},
{id:"TXT-0005",titolo:"Gerusalemme liberata, canto I, ottava 1",autore:"Torquato Tasso",anno:1581,datazione:"1581",luogo:"Ferrara",tipologia:"Poema",forma:"Ottava rima",soggetti:["crociata","guerra","fede"],licenza:"Pubblico dominio",verso:true,
descrizione:"Protasi del poema dedicato alla prima crociata e a Goffredo di Buglione.",
testo:`Canto l'arme pietose e 'l capitano
che 'l gran sepolcro liberò di Cristo.
Molto egli oprò co 'l senno e con la mano,
molto soffrì nel glorioso acquisto;
e in van l'Inferno vi s'oppose, e in vano
s'armò d'Asia e di Libia il popol misto.
Il Ciel gli diè favore, e sotto a i santi
segni ridusse i suoi compagni erranti.`},
{id:"TXT-0006",titolo:"Alla sera",autore:"Ugo Foscolo",anno:1803,datazione:"1803",luogo:"Milano",tipologia:"Lirica",forma:"Sonetto",soggetti:["sera","morte","tempo"],licenza:"Pubblico dominio",verso:true,
descrizione:"La sera come immagine della quiete fatale e del nulla eterno.",
testo:`Forse perché della fatal quïete
tu sei l'imago a me sì cara vieni
o Sera! E quando ti corteggian liete
le nubi estive e i zeffiri sereni,

e quando dal nevoso aere inquïete
tenebre e lunghe all'universo meni
sempre scendi invocata, e le secrete
vie del mio cor soavemente tieni.

Vagar mi fai co' miei pensieri su l'orme
che vanno al nulla eterno; e intanto fugge
questo reo tempo, e van con lui le torme

delle cure onde meco egli si strugge;
e mentre io guardo la tua pace, dorme
quello spirto guerrier ch'entro mi rugge.`},
{id:"TXT-0007",titolo:"L’infinito",autore:"Giacomo Leopardi",anno:1819,datazione:"1819",luogo:"Recanati",tipologia:"Lirica",forma:"Idillio in endecasillabi sciolti",soggetti:["infinito","silenzio","paesaggio"],licenza:"Pubblico dominio",verso:true,
descrizione:"Dalla siepe che esclude l’orizzonte nasce l’immaginazione di spazi interminati.",
testo:`Sempre caro mi fu quest'ermo colle,
e questa siepe, che da tanta parte
dell'ultimo orizzonte il guardo esclude.
Ma sedendo e mirando, interminati
spazi di là da quella, e sovrumani
silenzi, e profondissima quiete
io nel pensier mi fingo; ove per poco
il cor non si spaura. E come il vento
odo stormir tra queste piante, io quello
infinito silenzio a questa voce
vo comparando: e mi sovvien l'eterno,
e le morte stagioni, e la presente
e viva, e il suon di lei. Così tra questa
immensità s'annega il pensier mio:
e il naufragar m'è dolce in questo mare.`},
{id:"TXT-0008",titolo:"I promessi sposi, cap. I (incipit)",autore:"Alessandro Manzoni",anno:1840,datazione:"edizione 1840–1842",luogo:"Milano",tipologia:"Romanzo",forma:"Prosa",soggetti:["paesaggio","lago","Lombardia"],licenza:"Pubblico dominio",verso:false,
descrizione:"La celebre descrizione del ramo del lago di Como che apre il romanzo.",
testo:`Quel ramo del lago di Como, che volge a mezzogiorno, tra due catene non interrotte di monti, tutto a seni e a golfi, a seconda dello sporgere e del rientrare di quelli, vien, quasi a un tratto, a ristringersi, e a prender corso e figura di fiume, tra un promontorio a destra, e un'ampia costiera dall'altra parte; e il ponte, che ivi congiunge le due rive, par che renda ancor più sensibile all'occhio questa trasformazione, e segni il punto in cui il lago cessa, e l'Adda rincomincia, per ripigliar poi nome di lago dove le rive, allontanandosi di nuovo, lascian l'acqua distendersi e rallentarsi in nuovi golfi e in nuovi seni.`},
{id:"TXT-0009",titolo:"Pianto antico",autore:"Giosue Carducci",anno:1871,datazione:"1871",luogo:"Bologna",tipologia:"Lirica",forma:"Strofe di settenari",soggetti:["lutto","infanzia","natura"],licenza:"Pubblico dominio",verso:true,
descrizione:"Il melograno rinverdito e il figlio perduto: il contrasto tra la natura che rinasce e la morte.",
testo:`L'albero a cui tendevi
la pargoletta mano,
il verde melograno
da' bei vermigli fior,

nel muto orto solingo
rinverdì tutto or ora
e giugno lo ristora
di luce e di calor.

Tu fior de la mia pianta
percossa e inaridita,
tu de l'inutil vita
estremo unico fior,

sei ne la terra fredda,
sei ne la terra negra;
né il sol più ti rallegra
né ti risveglia amor.`},
{id:"TXT-0010",titolo:"X Agosto",autore:"Giovanni Pascoli",anno:1896,datazione:"1896",luogo:"San Mauro Pascoli",tipologia:"Lirica",forma:"Quartine di decasillabi e novenari",soggetti:["lutto","stelle","famiglia"],licenza:"Pubblico dominio",verso:true,
descrizione:"La notte di san Lorenzo e il pianto di stelle sull’uccisione del padre.",
testo:`San Lorenzo, io lo so perché tanto
di stelle per l'aria tranquilla
arde e cade, perché sì gran pianto
nel concavo cielo sfavilla.

Ritornava una rondine al tetto:
l'uccisero: cadde tra spini;
ella aveva nel becco un insetto:
la cena dei suoi rondinini.

Ora è là, come in croce, che tende
quel verme a quel cielo lontano;

function roman(n){const m=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let r="";for(const[v,s]of m){while(n>=v){r+=s;n-=v}}return r}

function hl(text, q){
  text = String(text ?? "");
  if(!q || q.length<2) return esc(text);
  const n = norm(text), nq = norm(q); let out="", i=0, j;
  while((j = n.indexOf(nq, i)) > -1){ out += esc(text.slice(i,j)) + "<mark>" + esc(text.slice(j, j+nq.length)) + "</mark>"; i = j+nq.length; }
  return out + esc(text.slice(i));
}

/* ---------- testo: token e statistiche ---------- */
function wordsWithPos(text){ const out=[]; let m; WORD_RE.lastIndex=0; while((m=WORD_RE.exec(text))){ out.push({w:m[0].toLowerCase(), s:m.index, e:m.index+m[0].length}) } return out }
function textStats(text){ const w = wordsWithPos(text).map(x=>x.w); const types = new Set(w); return {tokens:w.length, types:types.size, ttr: w.length? types.size/w.length : 0} }
function freq(texts, excludeStop=true){
  const m = new Map();
  texts.forEach(t => wordsWithPos(t).forEach(({w}) => { if(excludeStop && (STOP.has(w) || w.length<3)) return; m.set(w,(m.get(w)||0)+1) }));
  return [...m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],"it"));
}
function kwic(term, mode="inizia", width=7){
  const nt = norm(term).trim(); if(nt.length<2) return [];
  const rows = [];
  RECORDS.filter(r=>r.kind==="testo").forEach(r => {
    const ws = wordsWithPos(r.testo);
    ws.forEach((x,i) => {
      const nw = norm(x.w);
      const ok = mode==="esatta" ? nw===nt : mode==="contiene" ? nw.includes(nt) : nw.startsWith(nt);
      if(!ok) return;
      const a = ws[Math.max(0,i-width)], b = ws[Math.min(ws.length-1,i+width)];
      rows.push({r, left:r.testo.slice(a.s, x.s).replace(/\s+/g," "), key:r.testo.slice(x.s,x.e), right:r.testo.slice(x.e, b.e).replace(/\s+/g," ")});
    });
  });
  return rows;
}

function applyParams(p){
  F.q = p.get("q")||""; F.da = p.get("da")||""; F.a = p.get("a")||"";
  F.sort = p.get("ordina")||"rilevanza"; F.view = p.get("vista")||"schede";
  FACETS.forEach(f => { F[f.key] = new Set((p.get(f.key)||"").split("|").filter(Boolean)) });
}
function paramsString(){
  const p = new URLSearchParams();
  if(F.q) p.set("q",F.q);
  FACETS.forEach(f => { if(F[f.key].size) p.set(f.key,[...F[f.key]].join("|")) });
  if(F.da!=="") p.set("da",F.da); if(F.a!=="") p.set("a",F.a);
  if(F.sort!=="rilevanza") p.set("ordina",F.sort); if(F.view!=="schede") p.set("vista",F.view);
  return p.toString();
}
function catLink(obj){ const p=new URLSearchParams(); Object.entries(obj).forEach(([k,v])=>p.set(k,v)); return "#/catalogo?"+p.toString() }

function matches(r, skip){
  if(F.q){ const terms = norm(F.q).split(/\s+/).filter(Boolean); if(!terms.every(t => r._search.includes(t))) return false; }
  if(F.da!=="" && r.anno < +F.da) return false;
  if(F.a!=="" && r.anno > +F.a) return false;
  for(const f of FACETS){ if(f.key===skip || !F[f.key].size) continue; if(!f.get(r).some(v => F[f.key].has(v))) return false; }
  return true;
}
function score(r){
  if(!F.q) return 0; const t = norm(F.q); let s = 0;
  if(norm(r.titolo).includes(t)) s+=10; if(norm(r.autore).includes(t)) s+=6;
  if((r.soggetti||[]).some(x=>norm(x).includes(t))) s+=5;
  s += r._search.split(t).length-1; return s;
}
function filtered(){
  const list = RECORDS.filter(r => matches(r));
  const cmp = {
    rilevanza:(a,b)=>score(b)-score(a) || a.anno-b.anno,
    "anno-cresc":(a,b)=>a.anno-b.anno,
    "anno-decr":(a,b)=>b.anno-a.anno,
    titolo:(a,b)=>a.titolo.localeCompare(b.titolo,"it")
  }[F.sort] || ((a,b)=>a.anno-b.anno);
  return list.sort(cmp);
}

function barsHTML(items, {max, href, onclick}={}){
  const m = max || Math.max(1,...items.map(i=>i.total ?? i.value));
  return `<div class="bars">${items.map(i => {
    const segs = i.parts ? i.parts.map(p=>`<i style="width:${(p.v/m*100).toFixed(2)}%;background:${p.c}"></i>`).join("") : `<i style="width:${(i.value/m*100).toFixed(2)}%;background:${i.color||"var(--ink)"}"></i>`;
    const tip = esc(i.tip || `${i.label}: ${i.total ?? i.value}`);
    const inner = `<span class="lab">${esc(i.label)}</span><span class="track">${segs}</span><span class="v">${i.total ?? i.value}</span>`;
    return i.href ? `<a class="bar" href="${i.href}" data-tip="${tip}">${inner}</a>` : i.action ? `<button type="button" class="bar" data-act="${esc(i.action)}" data-tip="${tip}">${inner}</button>` : `<div class="bar" data-tip="${tip}">${inner}</div>`;
  }).join("")}</div>`;
}

function timelineSVG(recs, {compact=false}={}){
  const W=1000, H = compact ? 150 : 250, X0=170, X1=975, Y0=1200, Y1=1950;
  const sx = a => a < 1200 ? 28 + Math.max(0,Math.min(1,(a+1000)/2200))*100 : X0 + (a-Y0)/(Y1-Y0)*(X1-X0);
  const lanes = compact ? {oggetto:52, testo:104} : {oggetto:86, testo:178};
  const axisY = H-26;
  let g = `<line class="axis" x1="20" x2="${X1}" y1="${axisY}" y2="${axisY}"/>`;
  g += `<line class="axis" x1="${X0-22}" x2="${X0-22}" y1="10" y2="${axisY+6}" stroke-dasharray="3 4"/>`;
  g += `<text x="78" y="${axisY+20}" font-size="13" text-anchor="middle">prima del 1200</text>`;
  for(let y=1200;y<=1900;y+=100){ const x=sx(y); g += `<line class="axis" x1="${x}" x2="${x}" y1="${axisY}" y2="${axisY+6}"/><text x="${x}" y="${axisY+20}" font-size="13" text-anchor="middle">${y}</text>`; }
  if(!compact){ g += `<text x="${X0}" y="${lanes.oggetto-44}" font-size="14">Patrimonio culturale</text><text x="${X0}" y="${lanes.testo-44}" font-size="14">Testi letterari</text>`; }
  const buckets = {};
  [...recs].sort((a,b)=>a.anno-b.anno).forEach(r => {
    const x = sx(r.anno), lane = lanes[r.kind]||lanes.oggetto, key = r.kind+":"+Math.round(x/9);
    const k = buckets[key] = (buckets[key]||0)+1;
    const off = Math.ceil((k-1)/2)*11*((k-1)%2 ? -1 : 1);
    const tip = esc(`${r.titolo} (${r.datazione||r.anno})`);
    g += `<a href="#/record/${r.id}" aria-label="${tip}"><circle cx="${x.toFixed(1)}" cy="${lane+off}" r="${compact?5:6.5}" fill="${kcolor(r)}" data-tip="${tip}"/></a>`;
  });
  return `<svg class="viz-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cronologia dei record">${g}</svg>`;
}

const poly = pts => "M"+pts.map(([lo,la])=>proj(la,lo).map(n=>n.toFixed(1)).join(" ")).join("L")+"Z";

function mapSVG(recs, {highlight=null, small=false}={}){
  const groups = {};
  recs.forEach(r => { if(r.lat==null) return; (groups[r.luogo] ||= {lat:r.lat, lon:r.lon, o:0, t:0, c:0}); const g=groups[r.luogo]; if(r.contributo) g.c++; else if(r.kind==="testo") g.t++; else g.o++; });
  let g = `<path class="land" d="${poly(ITALIA)}"/><path class="land" d="${poly(SICILIA)}"/><path class="land" d="${poly(SARDEGNA)}"/>`;
  Object.entries(groups).sort((a,b)=>(b[1].o+b[1].t+b[1].c)-(a[1].o+a[1].t+a[1].c)).forEach(([name,d]) => {
    const [x,y] = proj(d.lat,d.lon), tot = d.o+d.t+d.c;
    const r = small ? 7 : 5 + Math.sqrt(tot)*5.5;
    const dim = highlight && highlight!==name;
    const parts = [{v:d.o,c:"var(--verde)"},{v:d.t,c:"var(--lapis)"},{v:d.c,c:"var(--contrib)"}].filter(p=>p.v);
    let a = -Math.PI/2, shapes = "";
    parts.forEach(p => {
      if(p.v===tot){ shapes += `<circle cx="${x}" cy="${y}" r="${r}" fill="${p.c}"/>`; return; }
      const a2 = a + p.v/tot*Math.PI*2;
      shapes += `<path d="M${x} ${y}L${(x+r*Math.cos(a)).toFixed(2)} ${(y+r*Math.sin(a)).toFixed(2)}A${r} ${r} 0 ${a2-a>Math.PI?1:0} 1 ${(x+r*Math.cos(a2)).toFixed(2)} ${(y+r*Math.sin(a2)).toFixed(2)}Z" fill="${p.c}"/>`;
      a = a2;
    });
    const tip = esc(`${name}: ${d.o} oggetti, ${d.t} testi${d.c?`, ${d.c} contributi`:""}`);
    g += `<a href="${catLink({luogo:name})}" opacity="${dim?.25:1}" aria-label="${tip}"><g data-tip="${tip}" stroke="var(--surface)" stroke-width="1.5">${shapes}</g></a>`;
    if(!small || name===highlight) g += `<text x="${x + r + 4}" y="${y+4}" font-size="${small?16:12}" style="fill:var(--ink)" opacity="${dim?.3:.85}">${esc(name)}</text>`;
  });
  return `<svg class="viz-svg" viewBox="0 0 470 560" role="img" aria-label="Mappa dei luoghi">${g}</svg>`;
}

function centuryHist(recs){
  const m = new Map(); recs.forEach(r => { const k=r.secolo; const o=m.get(k)||{o:0,t:0,c:0}; if(r.contributo) o.c++; else if(r.kind==="testo") o.t++; else o.o++; m.set(k,o) });
  const keys = [...m.keys()].sort((a,b)=>a-b); if(!keys.length) return "";
  const max = Math.max(...[...m.values()].map(v=>v.o+v.t+v.c));
  const cols = keys.map(k => { const v=m.get(k), tot=v.o+v.t+v.c, on=F.secolo.has(String(k));
    return `<button type="button" data-sec="${k}" aria-pressed="${on}" data-tip="${esc(secoloLong(k))}: ${tot} record" aria-label="${esc(secoloLong(k))}, ${tot} record">
      <i class="seg-o" style="height:${v.o/max*100}%"></i><i class="seg-t" style="height:${v.t/max*100}%"></i><i class="seg-c" style="height:${v.c/max*100}%"></i></button>` }).join("");
  const labels = keys.map(k=>`<span>${k>0?roman(k):roman(-k)+" a.C."}</span>`).join("");
  return `<div class="hist" role="group" aria-label="Distribuzione per secolo, tocca una colonna per filtrare">${cols}</div><div class="hist-labels" aria-hidden="true">${labels}</div>`;
}

function updateCatalog(initial){
  if(!initial){ try{ history.replaceState(null,"","#/catalogo"+(paramsString()?"?"+paramsString():"")) }catch(e){} }
  // facet
  $("#facetList").innerHTML = FACETS.map(f => {
    const counts = new Map();
    RECORDS.forEach(r => { if(!matches(r, f.key)) return; f.get(r).forEach(v => counts.set(v,(counts.get(v)||0)+1)) });
    F[f.key].forEach(v => { if(!counts.has(v)) counts.set(v,0) });
    let entries = [...counts.entries()];
    entries.sort(f.sort || ((a,b)=>b[1]-a[1] || String(a[0]).localeCompare(String(b[0]),"it")));
    if(!entries.length) return "";
    return `<div class="facet"><h3>${f.label}</h3><ul>${entries.map(([v,n]) => `<li><label class="${n?"":"zero"}"><input type="checkbox" data-facet="${f.key}" data-value="${esc(v)}" ${F[f.key].has(v)?"checked":""}>${esc(f.fmt?f.fmt(v):v)}<span class="ct">${n}</span></label></li>`).join("")}</ul></div>`;
  }).join("");
  // risultati
  const list = filtered();
  const chips = [];
  if(F.q) chips.push([`q::`, "Ricerca", F.q]);
  FACETS.forEach(f => F[f.key].forEach(v => chips.push([`${f.key}::${v}`, f.label, f.fmt?f.fmt(v):v])));
  if(F.da!=="") chips.push(["da::","Dal",F.da]); if(F.a!=="") chips.push(["a::","Al",F.a]);
  const nActive = chips.length;
  $("#ftoggle").textContent = $("#facets").classList.contains("open") ? "Nascondi i filtri" : `Mostra i filtri${nActive?` (${nActive} attivi)`:""}`;
  const body = $("#catBody");
  let res;
  if(!list.length){
    res = `<div class="empty"><h3>Nessun record corrisponde a questa combinazione</h3><p class="muted">Togli uno dei filtri attivi oppure prova una parola più breve: la ricerca trova anche parti di parola.</p><button class="btn ghost small" data-clear type="button">Azzera ricerca e filtri</button></div>`;
  } else if(F.view==="elenco"){
    res = `<div class="scroll-x"><table class="data"><thead><tr><th>Titolo</th><th>Collezione</th><th>Tipologia</th><th>Autore o ambito</th><th>Datazione</th><th>Luogo</th></tr></thead><tbody>${list.map(r=>`<tr><td><a href="#/record/${r.id}">${hl(r.titolo,F.q)}</a></td><td><span class="coll ${kclass(r)}">${collName(r)}</span></td><td>${esc(r.tipologia)}</td><td>${esc(r.autore||"non identificato")}</td><td>${esc(r.datazione||r.anno)}</td><td>${esc(r.luogo||"")}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    res = `<div class="grid-cards">${list.map(r => {
      let snip = "";
      if(F.q && r.kind==="testo"){ const n=norm(r.testo), i=n.indexOf(norm(F.q).split(/\s+/)[0]); if(i>-1){ const s=Math.max(0,i-50), e=Math.min(r.testo.length,i+70); snip = `<p class="snip">${s>0?"…":""}${hl(r.testo.slice(s,e).replace(/\n/g," / "),F.q.split(/\s+/)[0])}${e<r.testo.length?"…":""}</p>` } }
      return `<article class="card"><a href="#/record/${r.id}" class="thumb" tabindex="-1" aria-hidden="true">${thumb(r)}</a>
        <span class="coll ${kclass(r)}">${collName(r)}, ${esc(r.tipologia)}</span>
        <h3><a href="#/record/${r.id}">${hl(r.titolo,F.q)}</a></h3>
        <p>${hl(r.autore||"Autore non identificato",F.q)}</p><p>${esc(r.datazione||r.anno)}${r.luogo?", "+esc(r.luogo):""}</p>${r.nLinks?`<p class="lk">${r.nLinks} ${r.nLinks===1?"collegamento":"collegamenti"}</p>`:""}${snip}</article>`;
    }).join("")}</div>`;
  }
  body.innerHTML = `
    <div class="results-bar">
      <span class="count">${list.length} ${list.length===1?"record":"record"} su ${RECORDS.length}</span>
      <div class="ctrls">
        <label class="sr" for="csort">Ordina</label>
        <select id="csort">${[["rilevanza","Più pertinenti"],["anno-cresc","Dal più antico"],["anno-decr","Dal più recente"],["titolo","Per titolo"]].map(([v,l])=>`<option value="${v}" ${F.sort===v?"selected":""}>${l}</option>`).join("")}</select>
        <span class="seg" role="group" aria-label="Vista"><button type="button" data-view="schede" aria-pressed="${F.view!=="elenco"}">Schede</button><button type="button" data-view="elenco" aria-pressed="${F.view==="elenco"}">Elenco</button></span>
      </div>
    </div>
    ${nActive?`<div class="chips">${chips.map(([k,l,v])=>`<button type="button" class="chip" data-chip="${esc(k)}" aria-label="Rimuovi filtro ${esc(l)} ${esc(v)}"><b>${esc(l)}</b> ${esc(v)} ✕</button>`).join("")}<button type="button" class="chip" data-clear>Azzera tutto</button></div>`:""}
    ${list.length?centuryHist(list):""}
    ${res}`;
}

function relatedHTML(r){
  const rel = RECORDS.filter(x => x.id!==r.id).map(x => ({x, s:(x.tipologia===r.tipologia?3:0)+(x.luogo===r.luogo?2:0)+(x.secolo===r.secolo?2:0)+(x.soggetti||[]).filter(s=>(r.soggetti||[]).includes(s)).length*3})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,4).map(o=>o.x);

  return `<section class="related"><h2>Record collegati</h2><p class="muted small">Condividono tipologia, luogo, secolo o soggetti.</p><div class="grid-cards">${rel.map(x=>`<article class="card"><a href="#/record/${x.id}" class="thumb" tabindex="-1" aria-hidden="true">${thumb(x)}</a><span class="coll ${kclass(x)}">${collName(x)}</span><h3><a href="#/record/${x.id}">${esc(x.titolo)}</a></h3><p>${esc(x.datazione||x.anno)}${x.luogo?", "+esc(x.luogo):""}</p></article>`).join("")}</div></section>`;
}

const DS = {sort:"id", dir:1, page:0, q:"", fmt:"csv"};
function completeness(field){
  const app_ = RECORDS.filter(r => { const s = SCHEMA.find(x=>x.campo===field).si; return s==="tutti" || s===r.kind });
  const ok = app_.filter(r => { const v=r[field]; return Array.isArray(v) ? v.length>0 : v!==undefined && v!==null && String(v).trim()!=="" });
  return app_.length ? ok.length/app_.length : 0;
}
function exportText(fmt){
  const fields = SCHEMA.map(s=>s.campo);
  if(fmt==="json") return JSON.stringify(RECORDS.map(r=>Object.fromEntries(fields.filter(f=>r[f]!==undefined).map(f=>[f,r[f]]))),null,2);
  const cell = v => { v = Array.isArray(v)?v.join("; "):String(v??""); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v };
  return [fields.join(","), ...RECORDS.map(r=>fields.map(f=>cell(r[f])).join(","))].join("\n");
}

  $("#dlTab").addEventListener("click", () => saveFile(DS.fmt==="csv"?"scrinium.csv":"scrinium.json", $("#exp").value));
  const drawRdf = () => {
    const scope = $("#rdfScope").value, prof = $("#rdfProf").value, fmt = $("#rdfFmt").value;
    const recs = RECORDS.filter(r => scope==="tutto" || (scope==="collegati" ? r.nLinks>0 : r.kind===scope));
    const ids = new Set(recs.map(r=>r.id)); const lk = LINKS.filter(l => ids.has(l.testo) || ids.has(l.oggetto));
    const T = buildGraph(prof, recs, lk);
    $("#rdfOut").value = serialize(T, fmt);
    $("#rdfInfo").textContent = `${recs.length} record, ${lk.length} collegamenti, ${T.length.toLocaleString("it-IT")} triple`;
  };
  ["rdfScope","rdfProf","rdfFmt"].forEach(id => $("#"+id).addEventListener("change", drawRdf));
  $("#rdfCopy").addEventListener("click", () => copyFrom($("#rdfOut")));
  $("#rdfDl").addEventListener("click", () => { const f = RDF_FMT[$("#rdfFmt").value]; saveFile(f.file, $("#rdfOut").value); if(f.file.endsWith(".txt")) toast("Salvato come .txt: rinomina il file togliendo l’estensione finale"); });
  drawTable(); drawExp(); drawRdf();
}

            <div class="field"><label for="f-datazione">Datazione testuale <span class="hint">facoltativa</span></label><input id="f-datazione" name="datazione" type="text" placeholder="es. metà del XVI secolo"></div>

        </fieldset>
        <fieldset><legend>Descrizione</legend>
          <div class="field" data-only="oggetto"><label for="f-materia">Materia e tecnica</label><input id="f-materia" name="materia" type="text" placeholder="es. Maiolica dipinta in policromia"></div>

  const read = () => {
    const d = Object.fromEntries(new FormData(form).entries());
    const r = {kind:FORM.kind, titolo:(d.titolo||"").trim(), autore:(d.autore||"").trim(), tipologia:d.tipologia||"", anno:d.anno===""||d.anno==null?null:parseInt(d.anno,10), datazione:(d.datazione||"").trim(), luogo:d.luogo||"", soggetti:(d.soggetti||"").split(",").map(s=>s.trim()).filter(Boolean), descrizione:(d.descrizione||"").trim(), licenza:d.licenza};

    if(!r.datazione && r.anno!=null && !isNaN(r.anno)) r.datazione = r.anno<0 ? `${-r.anno} a.C.` : String(r.anno);
    return {r, diritti:!!d.diritti};
  };
  const validate = ({r,diritti}) => {
    const e = {};
    if(r.titolo.length<3) e.titolo="Inserisci un titolo di almeno 3 caratteri.";
    if(!r.tipologia) e.tipologia="Scegli una tipologia dal vocabolario.";
    if(r.anno==null || isNaN(r.anno)) e.anno="Inserisci un anno, anche approssimativo."; else if(r.anno>2026||r.anno<-5000) e.anno="L’anno deve essere compreso tra -5000 e 2026.";
    if(r.descrizione.length<10) e.descrizione="Scrivi una descrizione di almeno 10 caratteri.";
    if(r.kind==="testo" && (r.testo||"").split(/\s+/).filter(Boolean).length<5) e.testo="Incolla un testo di almeno 5 parole.";
    if(!diritti) e.diritti="Conferma i diritti di pubblicazione per continuare.";
    return e;
  };
  const preview = () => {
    const {r} = read();
    const fake = {...r, id:"CTB-nuovo", contributo:true, titolo:r.titolo||"Titolo della scheda", anno:r.anno??"", testo:r.testo||"Il testo comparirà qui"};
    $("#pv").innerHTML = `<article class="card" style="max-width:300px"><div class="thumb">${thumb(fake)}</div><span class="coll k-contrib">Contributo, ${esc(r.tipologia||"tipologia")}</span><h3>${esc(fake.titolo)}</h3><p>${esc(r.autore||"Autore non identificato")}</p><p>${esc(r.datazione||"Data da indicare")}${r.luogo?", "+esc(r.luogo):""}</p></article>`;
    const dc = {"dc:identifier":"CTB-…","dc:title":r.titolo,"dc:creator":r.autore||undefined,"dc:type":r.tipologia,"dc:date":r.anno,"dcterms:temporal":r.datazione||undefined,"dcterms:spatial":r.luogo||undefined,"dcterms:medium":r.materia||undefined,"dc:format":r.forma||undefined,"dcterms:extent":r.dimensioni||undefined,"dc:subject":r.soggetti.length?r.soggetti:undefined,"dc:description":r.descrizione,"dc:rights":r.licenza};
    if(r.testo) dc["tei:text"] = r.testo.length>80 ? r.testo.slice(0,80)+"…" : r.testo;
    $("#pvJson").textContent = JSON.stringify(dc,null,2);
  };
  const drawMine = () => {
    if(!$("#mine")) return;
    const mine = STORE.mode==="db" ? CONTRIB.filter(c=>c.autoreId && c.autoreId===STORE.myId) : CONTRIB;
    const others = STORE.mode==="db" ? CONTRIB.length - mine.length : 0;
    const pend = STORE.pending && (STORE.pending.contrib.length + STORE.pending.links.length);
    $("#mine").innerHTML = (mine.length ? `<h3 style="font-family:var(--sans);font-size:1rem;margin-top:24px">Le tue schede</h3><ul class="mine" style="list-style:none;padding:0;margin:0">${mine.map(c=>`<li><a href="#/record/${esc(c.id)}">${esc(c.titolo)}</a><button class="btn ghost small" type="button" data-del="${esc(c.id)}">Rimuovi</button></li>`).join("")}</ul>` : "")
      + (others ? `<p class="small muted" style="margin-top:14px">Altre ${others} schede sono state aggiunte da altre persone: le trovi nel <a href="${catLink({kind:"contributo"})}">catalogo</a>.</p>` : "")
      + (pend && STORE.canWrite ? `<div class="cite" style="margin-top:16px"><p style="margin:0 0 8px">Hai ${pend} elementi salvati solo in questo browser in una sessione precedente.</p><button class="btn small" type="button" id="pubPending">Pubblicali nell’archivio condiviso</button></div>` : "");
  };
  window.__drawMine = drawMine;
  form.addEventListener("change", e => { if(e.target.name==="kind"){ setKind(e.target.value) } preview() });
  form.addEventListener("input", preview);
  form.addEventListener("reset", () => setTimeout(()=>{ setKind(FORM.kind); $$("[data-err]").forEach(x=>x.textContent=""); preview() },0));
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if(!STORE.canWrite){ toast("Hai accesso in sola lettura: non puoi aggiungere schede"); return; }
    const data = read(), errs = validate(data);
    $$("[data-err]").forEach(x => x.textContent = errs[x.dataset.err]||"");
    const first = Object.keys(errs)[0];
    if(first){ const el = form.querySelector(`[name="${first}"]`); if(el) el.focus(); toast("Completa i campi segnalati"); return; }
    const rec = {...data.r, id:"CTB-"+rid()};
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
    try{ await addContrib(rec); toast("Scheda aggiunta al catalogo"); form.reset(); drawMine(); }
    catch(err){ toast(writeErrorMsg(err)); $("#storeStatus").textContent = storeStatusHTML(); }
    btn.disabled = false;
  });
  $("#mine").addEventListener("click", async e => {
    if(e.target.closest("#pubPending")){ e.target.disabled = true; await publishPending(); return; }
    const b=e.target.closest("[data-del]"); if(!b) return; b.disabled = true;
    try{ await removeContrib(b.dataset.del); toast("Scheda rimossa") }catch(err){ b.disabled=false; toast(writeErrorMsg(err)) }
  });
  setKind(FORM.kind); preview(); drawMine();
}

/* ---------- router, tema, tooltip ---------- */
function render(keepScroll){
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  const params = new URLSearchParams(qs||"");
  const page = parts[0] || "home";
  $$(".nav a").forEach(a => a.dataset.nav===page ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  $("#tip").style.opacity = 0;
  if(page==="catalogo") pageCatalogo(params);
  else if(page==="record") pageRecord(decodeURIComponent(parts[1]||""), params);
  else if(page==="esplora") pageEsplora(parts[1], params);
  else if(page==="dataset") pageDataset();
  else if(page==="contribuisci") pageContribuisci();
  else pageHome();
  if(!keepScroll) window.scrollTo(0,0);
  const titles = {catalogo:"Catalogo",esplora:"Esplora",dataset:"Dataset",contribuisci:"Contribuisci",record:(byId(parts[1])||{}).titolo};
  document.title = (titles[page] ? titles[page]+", " : "") + "Scrinium";
}
window.addEventListener("hashchange", render);

(function theme(){
  const root = document.documentElement; let saved = null;
  try{ saved = localStorage.getItem("scrinium-tema") }catch(e){}
  if(saved) root.dataset.theme = saved;
  const isDark = () => root.dataset.theme ? root.dataset.theme==="dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const label = () => $("#themeBtn").textContent = isDark() ? "Tema chiaro" : "Tema scuro";
  label();
  $("#themeBtn").addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; try{ localStorage.setItem("scrinium-tema", root.dataset.theme) }catch(e){} label() });
})();

(function tooltip(){
  const tip = $("#tip");
  document.addEventListener("mousemove", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if(!t){ tip.style.opacity = 0; return; }
    tip.textContent = t.getAttribute("data-tip");
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px"; tip.style.opacity = 1;
  });
})();

let LINKS = [];
const linksOf = id => LINKS.filter(l => l.testo===id || l.oggetto===id);
function rebuildLinks(){
  const ids = new Set(RECORDS.map(r=>r.id));
  LINKS = [...LINKS_CURATED.map(l=>({...l, curato:true})), ...LINKS_USER]
    .filter(l => ids.has(l.testo) && ids.has(l.oggetto) && LINK_TYPES[l.tipo]);
  const n = {}; LINKS.forEach(l => { n[l.testo]=(n[l.testo]||0)+1; n[l.oggetto]=(n[l.oggetto]||0)+1 });
  RECORDS.forEach(r => r.nLinks = n[r.id]||0);
}

function annotateHTML(r){
  const t = r.testo, nt = norm(t), ranges = [];
  linksOf(r.id).forEach(l => {
    if(!l.passo) return; const p = norm(l.passo).trim(); if(p.length<2) return;
    const i = nt.indexOf(p); if(i<0 || t.slice(i,i+p.length).includes("\n")) return;
    if(ranges.some(x => i < x.e && i+p.length > x.s)) return;
    ranges.push({s:i, e:i+p.length, l});
  });
  ranges.sort((a,b)=>a.s-b.s);
  let out = "", i = 0;
  ranges.forEach(x => { const o = byId(x.l.oggetto);
    out += esc(t.slice(i,x.s)) + `<a class="anno" href="#/record/${esc(x.l.oggetto)}" data-tip="${esc(LINK_TYPES[x.l.tipo].label+": "+(o?o.titolo:""))}">${esc(t.slice(x.s,x.e))}</a>`; i = x.e; });
  return out + esc(t.slice(i));
}

function linkItemHTML(l, r){
  const t = LINK_TYPES[l.tipo], otherId = r.kind==="testo" ? l.oggetto : l.testo, o = byId(otherId);
  const phrase = r.kind==="testo" ? t.fromT : t.fromO;
  const who = l.curato ? "A cura della redazione" : `Aggiunto da <span data-uid="${esc(l.autoreId||"")}">un utente</span>${l.creato?", "+new Date(l.creato).toLocaleDateString("it-IT"):""}`;
  return `<li class="link-item" style="--lc:${t.color}">
    <p class="lrel"><span class="lt">${esc(phrase)}</span> <a href="#/record/${esc(otherId)}">${esc(o?o.titolo:otherId)}</a> <span class="muted small">${esc(o?(o.autore||collName(o)):"")}${o?", "+esc(o.datazione||o.anno):""}</span></p>
    ${l.nota?`<p class="lnote">${esc(l.nota)}</p>`:""}
    ${l.passo?`<p class="small">Passo: <a href="#/record/${esc(l.testo)}?q=${encodeURIComponent(l.passo)}">«${esc(l.passo)}»</a></p>`:""}
    <p class="small muted lwho">${who}${canDelete(l)?` <button type="button" class="linkbtn" data-dellink="${esc(l.id)}">Rimuovi</button>`:""}</p>
  </li>`;
}
function drawLinksList(r){
  const box = $("#linksList"); if(!box) return;
  const ls = linksOf(r.id).sort((a,b)=>(b.curato?1:0)-(a.curato?1:0));
  box.innerHTML = ls.length ? `<ul class="links">${ls.map(l=>linkItemHTML(l,r)).join("")}</ul>`
    : `<p class="muted">Questa scheda non ha ancora collegamenti. Aggiungine uno per metterla in relazione con ${r.kind==="testo"?"un oggetto":"un testo"} del catalogo.</p>`;
  fillNames(box);
}
function linksSectionHTML(r){
  const other = RECORDS.filter(x => x.kind !== r.kind).sort((a,b)=>a.titolo.localeCompare(b.titolo,"it"));

function wireLinks(r){

    if(otherId && tipo && LINKS.some(l => l.testo===testoId && l.oggetto===oggettoId && l.tipo===tipo)) errs.tipo = "Questo collegamento esiste già con lo stesso tipo di relazione.";
    $$("[data-lerr]", f).forEach(x => x.textContent = errs[x.dataset.lerr]||"");

}

function networkSVG(showAll){
  const texts = RECORDS.filter(r=>r.kind==="testo").sort((a,b)=>a.anno-b.anno);
  const linked = new Set(LINKS.map(l=>l.oggetto));
  const objs = RECORDS.filter(r=>r.kind==="oggetto" && (showAll || linked.has(r.id))).sort((a,b)=>a.anno-b.anno);
  const rows = Math.max(texts.length, objs.length, 2), W = 1000, H = 50 + rows*40, XL = 330, XR = 670;
  const ys = (i,n) => n<=1 ? H/2 : 30 + i*((H-60)/(n-1));
  const pos = {}; texts.forEach((t,i)=>pos[t.id]=[XL,ys(i,texts.length)]); objs.forEach((o,i)=>pos[o.id]=[XR,ys(i,objs.length)]);
  const cut = s => s.length>36 ? s.slice(0,34)+"…" : s;
  let edges = "";
  LINKS.forEach(l => { const a=pos[l.testo], b=pos[l.oggetto]; if(!a||!b) return; const t=LINK_TYPES[l.tipo];
    const tip = esc(`${byId(l.testo).titolo} ${t.fromT} ${byId(l.oggetto).titolo}`);
    edges += `<path class="edge" data-ends="${esc(l.testo)} ${esc(l.oggetto)}" d="M${a[0]+8} ${a[1]}C${W/2} ${a[1]} ${W/2} ${b[1]} ${b[0]-8} ${b[1]}" stroke="${t.color}" ${l.tipo==="contesto"?'stroke-dasharray="6 5"':""} data-tip="${tip}"/>`; });
  const node = (r,left) => { const [x,y]=pos[r.id];
    return `<a href="#/record/${esc(r.id)}" class="node" data-node="${esc(r.id)}"><circle cx="${x}" cy="${y}" r="${5+Math.min(r.nLinks,5)*1.4}" fill="${kcolor(r)}" data-tip="${esc(r.titolo)}: ${r.nLinks} collegamenti"/><text x="${left?x-16:x+16}" y="${y+4}" font-size="13" text-anchor="${left?"end":"start"}" style="fill:var(--ink)">${esc(cut(r.titolo))}</text><text x="${left?x-16:x+16}" y="${y+18}" font-size="10.5" text-anchor="${left?"end":"start"}">${esc(cut((r.autore||collName(r))+", "+(r.datazione||r.anno)))}</text></a>`; };
  return `<svg class="viz-svg net" id="netSvg" viewBox="0 0 ${W} ${H+10}" role="img" aria-label="Rete dei collegamenti tra testi e oggetti">
    <text x="${XL}" y="14" font-size="13" text-anchor="end" font-weight="700">Testi letterari</text><text x="${XR}" y="14" font-size="13" font-weight="700">Oggetti del patrimonio</text>
    <g transform="translate(0,14)">${edges}${texts.map(t=>node(t,true)).join("")}${objs.map(o=>node(o,false)).join("")}</g></svg>`;
}
function wireNetwork(){
  const svg = $("#netSvg"); if(!svg) return;
  const on = id => { svg.classList.add("focus"); $$(".edge",svg).forEach(p=>p.classList.toggle("on", p.dataset.ends.split(" ").includes(id))); $$(".node",svg).forEach(n=>n.classList.toggle("on", n.dataset.node===id || $$(".edge.on",svg).some(p=>p.dataset.ends.split(" ").includes(n.dataset.node)))) };
  const off = () => { svg.classList.remove("focus"); $$(".on",svg).forEach(x=>x.classList.remove("on")) };
  svg.addEventListener("mouseover", e => { const n=e.target.closest(".node"); n ? on(n.dataset.node) : null });

  svg.addEventListener("focusin", e => { const n=e.target.closest(".node"); if(n) on(n.dataset.node) });
  svg.addEventListener("focusout", off);
}

const BASE = "https://scrinium.example.org/";
const NS = {
  rdf:"http://www.w3.org/1999/02/22-rdf-syntax-ns#", rdfs:"http://www.w3.org/2000/01/rdf-schema#", owl:"http://www.w3.org/2002/07/owl#",
  xsd:"http://www.w3.org/2001/XMLSchema#", skos:"http://www.w3.org/2004/02/skos/core#", dc:"http://purl.org/dc/elements/1.1/",
  dcterms:"http://purl.org/dc/terms/", dcmitype:"http://purl.org/dc/dcmitype/", crm:"http://www.cidoc-crm.org/cidoc-crm/",
  lrmoo:"http://iflastandards.info/ns/lrm/lrmoo/", geo:"http://www.opengis.net/ont/geosparql#", schema:"https://schema.org/",
  scr:BASE+"ontologia#", res:BASE+"id/"
};
const LIC_URI = {"Pubblico dominio":"https://creativecommons.org/publicdomain/mark/1.0/","CC0 1.0":"https://creativecommons.org/publicdomain/zero/1.0/","CC BY 4.0":"https://creativecommons.org/licenses/by/4.0/","CC BY-SA 4.0":"https://creativecommons.org/licenses/by-sa/4.0/"};
const CRM_MAP = {
  id:"P1_is_identified_by → E42_Identifier", kind:"rdf:type E22_Human-Made_Object / lrmoo:F2_Expression", titolo:"P102_has_title → E35_Title",
  autore:"E12_Production o lrmoo:F28 → P14_carried_out_by → E39_Actor", anno:"P4_has_time-span → E52 → P82a / P82b",
  datazione:"E52_Time-Span → P82_at_some_time_within", luogo:"P7_took_place_at → E53_Place → P168", tipologia:"P2_has_type → E55_Type (skos:Concept)",
  materia:"P45_consists_of → E57_Material", forma:"P2_has_type → E55_Type", dimensioni:"P43_has_dimension → E54_Dimension",
  soggetti:"P129_is_about (testi), dcterms:subject", conservazione:"P44_has_condition → E3_Condition_State", licenza:"P104_is_subject_to → E30_Right",
  descrizione:"P3_has_note", testo:"P190_has_symbolic_content"
};
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "x";
const L = (v, lang) => ({v:String(v), lang});
const D = (v, dt) => ({v:String(v), dt});
const gYear = a => a<0 ? "-"+String(-a).padStart(4,"0") : String(a).padStart(4,"0");

function buildGraph(profile, recs, links){
  const T = [], seen = new Set();
  const add = (s,p,o) => T.push([s,p,o]);
  const once = (key, fn) => { if(seen.has(key)) return; seen.add(key); fn(); };
  const R = id => "res:"+id;
  const typeNode = (kind, label, scheme) => { const n = `res:${kind}-${slug(label)}`; once(n, () => { add(n,"rdf:type","skos:Concept"); if(profile==="crm") add(n,"rdf:type","crm:E55_Type"); add(n,"skos:prefLabel",L(label,"it")); add(n,"skos:inScheme",`res:schema-${scheme}`); }); return n; };
  const placeNode = name => { const n = `res:luogo-${slug(name)}`; once(n, () => {
      add(n,"rdf:type", profile==="crm" ? "crm:E53_Place" : "dcterms:Location"); add(n,"rdfs:label",L(name,"it"));
      const c = LUOGHI[name]; if(c){ const wkt = D(`POINT(${c[1]} ${c[0]})`,"geo:wktLiteral");
        if(profile==="crm") add(n,"crm:P168_place_is_defined_by",wkt); else { add(n,"geo:hasGeometry",n+"-geom"); add(n+"-geom","rdf:type","geo:Geometry"); add(n+"-geom","geo:asWKT",wkt); } } }); return n; };
  const actorNode = (name, person) => { const n = `res:attore-${slug(name)}`; once(n, () => { add(n,"rdf:type", profile==="crm" ? (person?"crm:E21_Person":"crm:E74_Group") : "dcterms:Agent"); add(n,"rdfs:label",L(name,"it")); }); return n; };
  ["tipologie","soggetti","forme","conservazione"].forEach(s => once("scheme"+s, () => { add(`res:schema-${s}`,"rdf:type","skos:ConceptScheme"); add(`res:schema-${s}`,"rdfs:label",L(`Vocabolario Scrinium: ${s}`,"it")); }));
  if(links.length && profile==="crm"){
    Object.values(LINK_TYPES).forEach(t => { add(t.prop,"rdf:type","owl:ObjectProperty"); if(t.sym) add(t.prop,"rdf:type","owl:SymmetricProperty"); add(t.prop,"rdfs:label",L(t.label,"it")); add(t.prop,"rdfs:comment",L(t.desc,"it")); add(t.prop,"rdfs:subPropertyOf",t.super); });
  }

  recs.forEach(r => {
    const s = R(r.id), isT = r.kind==="testo";
    if(profile==="crm"){
      add(s,"rdf:type", isT ? "lrmoo:F2_Expression" : "crm:E22_Human-Made_Object");
      add(s,"rdfs:label",L(r.titolo,"it"));
      add(s,"crm:P1_is_identified_by",s+"-id"); add(s+"-id","rdf:type","crm:E42_Identifier"); add(s+"-id","crm:P190_has_symbolic_content",L(r.id));
      add(s,"crm:P102_has_title",s+"-titolo"); add(s+"-titolo","rdf:type","crm:E35_Title"); add(s+"-titolo","crm:P190_has_symbolic_content",L(r.titolo,"it"));
      add(s,"crm:P2_has_type",typeNode("tipo",r.tipologia,"tipologie"));
      const ev = s+(isT?"-creazione":"-produzione");
      if(isT){ add(s,"lrmoo:R17i_was_created_by",ev); add(ev,"rdf:type","lrmoo:F28_Expression_Creation"); add(ev,"lrmoo:R17_created",s);
               add(R(r.id)+"-opera","rdf:type","lrmoo:F1_Work"); add(R(r.id)+"-opera","rdfs:label",L(r.titolo,"it")); add(R(r.id)+"-opera","lrmoo:R3_is_realised_in",s); add(ev,"lrmoo:R19_created_a_realisation_of",R(r.id)+"-opera"); }
      else { add(s,"crm:P108i_was_produced_by",ev); add(ev,"rdf:type","crm:E12_Production"); }
      if(r.autore) add(ev,"crm:P14_carried_out_by",actorNode(r.autore,isT));
      add(ev,"crm:P4_has_time-span",s+"-tempo"); add(s+"-tempo","rdf:type","crm:E52_Time-Span");
      add(s+"-tempo","crm:P82a_begin_of_the_begin",D(gYear(r.anno),"xsd:gYear")); add(s+"-tempo","crm:P82b_end_of_the_end",D(gYear(r.anno),"xsd:gYear"));
      if(r.datazione) add(s+"-tempo","crm:P82_at_some_time_within",L(r.datazione,"it"));
      if(r.luogo) add(ev,"crm:P7_took_place_at",placeNode(r.luogo));
      if(r.materia){ const m=`res:materiale-${slug(r.materia)}`; once(m,()=>{add(m,"rdf:type","crm:E57_Material");add(m,"rdfs:label",L(r.materia,"it"))}); add(s,"crm:P45_consists_of",m); }
      if(r.dimensioni){ add(s,"crm:P43_has_dimension",s+"-misure"); add(s+"-misure","rdf:type","crm:E54_Dimension"); add(s+"-misure","crm:P3_has_note",L(r.dimensioni,"it")); }
      if(r.forma) add(s,"crm:P2_has_type",typeNode("forma",r.forma,"forme"));
      if(r.conservazione){ add(s,"crm:P44_has_condition",s+"-stato"); add(s+"-stato","rdf:type","crm:E3_Condition_State"); add(s+"-stato","crm:P2_has_type",typeNode("stato",r.conservazione,"conservazione")); }
      (r.soggetti||[]).forEach(x => { const c = typeNode("soggetto",x,"soggetti"); add(s, isT ? "crm:P129_is_about" : "dcterms:subject", c); });
      add(s,"crm:P104_is_subject_to",`res:diritto-${slug(r.licenza)}`);
      once("lic"+r.licenza, () => { const d=`res:diritto-${slug(r.licenza)}`; add(d,"rdf:type","crm:E30_Right"); add(d,"rdfs:label",L(r.licenza)); if(LIC_URI[r.licenza]) add(d,"owl:sameAs",LIC_URI[r.licenza]); });
      if(r.descrizione) add(s,"crm:P3_has_note",L(r.descrizione,"it"));
      if(isT){ add(s,"crm:P72_has_language","http://id.loc.gov/vocabulary/iso639-2/ita"); if(r.testo) add(s,"crm:P190_has_symbolic_content",L(r.testo,"it")); }
    } else {
      add(s,"rdf:type", isT ? "dcmitype:Text" : "dcmitype:PhysicalObject");
      add(s,"dcterms:identifier",L(r.id)); add(s,"dcterms:title",L(r.titolo,"it"));
      if(r.autore) add(s,"dcterms:creator",actorNode(r.autore,isT));
      add(s,"dcterms:created",D(gYear(r.anno),"xsd:gYear"));
      if(r.datazione) add(s,"dc:date",L(r.datazione,"it"));
      if(r.luogo) add(s,"dcterms:spatial",placeNode(r.luogo));
      add(s,"dcterms:type",typeNode("tipo",r.tipologia,"tipologie"));
      if(r.materia) add(s,"dc:format",L(r.materia,"it"));
      if(r.forma) add(s,"dc:format",L(r.forma,"it"));
      if(r.dimensioni){ add(s,"dcterms:extent",s+"-misure"); add(s+"-misure","rdf:type","dcterms:SizeOrDuration"); add(s+"-misure","rdf:value",L(r.dimensioni,"it")); }
      (r.soggetti||[]).forEach(x => add(s,"dcterms:subject",typeNode("soggetto",x,"soggetti")));
      if(r.descrizione) add(s,"dcterms:description",L(r.descrizione,"it"));
      if(LIC_URI[r.licenza]) add(s,"dcterms:license",LIC_URI[r.licenza]); add(s,"dc:rights",L(r.licenza));
      if(isT){ add(s,"dcterms:language","http://id.loc.gov/vocabulary/iso639-2/ita"); if(r.testo) add(s,"schema:text",L(r.testo,"it")); }
    }
  });

  const inSet = new Set(recs.map(r=>r.id));
  links.forEach(l => {
    const t = LINK_TYPES[l.tipo], a = R(l.testo), b = R(l.oggetto);
    [l.testo,l.oggetto].forEach(id => { if(!inSet.has(id)){ const o=byId(id); if(o) once("lbl"+id, () => add(R(id),"rdfs:label",L(o.titolo,"it"))); } });
    if(profile==="crm"){
      if(l.tipo==="illustra") add(b,t.prop,a); else add(a,t.prop,b);
      const n = R(l.id);
      add(n,"rdf:type","crm:E13_Attribute_Assignment");
      add(n,"crm:P140_assigned_attribute_to", l.tipo==="illustra" ? b : a);
      add(n,"crm:P141_assigned", l.tipo==="illustra" ? a : b);
      add(n,"crm:P177_assigned_property_of_type",t.prop);
      if(l.nota) add(n,"crm:P3_has_note",L(l.nota,"it"));
      if(l.passo) add(n,"crm:P3_has_note",L("Passo: "+l.passo,"it"));
      add(n,"crm:P14_carried_out_by", l.curato ? "res:redazione" : "res:contributore");
      once("ag"+(l.curato?"r":"c"), () => { const g = l.curato?"res:redazione":"res:contributore"; add(g,"rdf:type","crm:E74_Group"); add(g,"rdfs:label",L(l.curato?"Redazione di Scrinium":"Utenti di Scrinium","it")); });
    } else {
      if(l.tipo==="evoca") add(a,"dcterms:references",b);
      else if(l.tipo==="illustra") add(b,"dcterms:relation",a);
      else { add(a,"dcterms:relation",b); add(b,"dcterms:relation",a); }

}

const isIRI = t => typeof t==="string" && /^https?:\/\//.test(t);
const expand = t => isIRI(t) ? t : NS[t.slice(0,t.indexOf(":"))] + t.slice(t.indexOf(":")+1);

function toTurtle(T){

  return `# Scrinium, esportazione RDF generata il ${new Date().toLocaleDateString("it-IT")}\n${head}\n\n${body}`.trimEnd()+"\n";
}
function toNTriples(T){
  const term = o => typeof o==="object" ? `"${escLit(o.v)}"` + (o.lang?"@"+o.lang : o.dt?`^^<${expand(o.dt)}>`:"") : `<${expand(o)}>`;
  return T.map(([s,p,o]) => `${term(s)} ${term(p)} ${term(o)} .`).join("\n")+"\n";
}
function toJSONLD(T){
  const nodes = new Map(), used = new Set();
  const pf = t => { if(!isIRI(t)) used.add(t.split(":")[0]); return t; };
  T.forEach(([s,p,o]) => {
    if(!nodes.has(s)) nodes.set(s, {"@id":pf(s)}); const n = nodes.get(s);
    if(p==="rdf:type"){ (n["@type"] ||= []).push(pf(o)); return; }
    const v = typeof o==="object" ? (o.lang ? {"@value":o.v,"@language":o.lang} : o.dt ? {"@value":o.v,"@type":pf(o.dt)} : {"@value":o.v}) : {"@id":pf(o)};
    (n[pf(p)] ||= []).push(v);
  });
  const ctx = {}; Object.keys(NS).filter(k=>used.has(k)).forEach(k=>ctx[k]=NS[k]);
  return JSON.stringify({"@context":ctx, "@graph":[...nodes.values()]}, null, 2);
}
function serialize(T, fmt){ return fmt==="jsonld" ? toJSONLD(T) : fmt==="nt" ? toNTriples(T) : toTurtle(T); }
const RDF_FMT = {ttl:{label:"Turtle", file:"scrinium.ttl.txt"}, jsonld:{label:"JSON-LD", file:"scrinium.jsonld.json"}, nt:{label:"N-Triples", file:"scrinium.nt.txt"}};
const RDF_PROFILE = {crm:"CIDOC-CRM e LRMoo", dc:"Dublin Core e SKOS"};

/* =========================================================
   ARCHIVIO CONDIVISO (db) CON RIPIEGO LOCALE
   ========================================================= */
function rid(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
const ID_RE = /^(OGG|TXT|CTB|COL|LNK)-[A-Z0-9]{3,12}$/;
function cleanRecord(d, id){
  if(!d || typeof d!=="object" || !ID_RE.test(id) || !id.startsWith("CTB-")) return null;
  const kind = d.kind==="testo" ? "testo" : d.kind==="oggetto" ? "oggetto" : null; if(!kind) return null;
  const anno = typeof d.anno==="number" && isFinite(d.anno) ? Math.round(d.anno) : null; if(anno===null) return null;
  const s = (v,n=2000) => typeof v==="string" ? v.slice(0,n) : "";
  const r = {id, kind, titolo:s(d.titolo,300)||"Senza titolo", autore:s(d.autore,200), tipologia:s(d.tipologia,80)||"Non indicata", anno, datazione:s(d.datazione,120),
    luogo:s(d.luogo,80), soggetti:Array.isArray(d.soggetti)?d.soggetti.filter(x=>typeof x==="string").slice(0,20).map(x=>x.slice(0,60)):[],
    descrizione:s(d.descrizione), licenza:LICENZE.includes(d.licenza)?d.licenza:"CC BY 4.0",
    autoreId: typeof d.autoreId==="string" ? d.autoreId : null, creato: typeof d.creato==="number" ? d.creato : 0};
  if(kind==="oggetto"){ r.materia=s(d.materia,300); r.dimensioni=s(d.dimensioni,120); r.conservazione=["Buono","Discreto","Mediocre"].includes(d.conservazione)?d.conservazione:""; }
  else { r.forma=s(d.forma,120); r.testo=s(d.testo,200000); r.verso=!!d.verso; }
  return r;
}
function cleanLink(d, id){
  if(!d || typeof d!=="object" || !ID_RE.test(id)) return null;
  if(!ID_RE.test(d.testo||"") || !ID_RE.test(d.oggetto||"") || !LINK_TYPES[d.tipo]) return null;
  const passo = typeof d.passo==="string" ? d.passo.slice(0,200).replace(/\n/g," ") : "";
  return {id, testo:d.testo, oggetto:d.oggetto, tipo:d.tipo, passo, nota: typeof d.nota==="string" ? d.nota.slice(0,1000) : "",
    autoreId: typeof d.autoreId==="string" ? d.autoreId : null, creato: typeof d.creato==="number" ? d.creato : 0};
}
function canDelete(item){ if(item.curato) return false; if(STORE.mode!=="db") return true; return STORE.canWrite && (item.autoreId===STORE.myId || STORE.isEditor); }
function writeErrorMsg(err){
  const c = err && err.code;
  if(c==="invalid_argument"){ STORE.canWrite = false; return "Hai accesso in sola lettura: la modifica non è stata salvata."; }
  if(c==="quota_exceeded") return "L’archivio ha raggiunto il limite di spazio: rimuovi qualche scheda e riprova.";
  if(c==="resource_exhausted") return "Troppe operazioni in poco tempo: attendi qualche secondo e riprova.";
  return "Il salvataggio non è riuscito per un problema di connessione: riprova tra poco.";
}
async function withRetry(fn){ try{ return await fn() }catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*800)); return fn(); } throw e; } }

async function addContrib(rec){
  const body = {...rec, creato:Date.now(), autoreId:STORE.myId};
  if(STORE.mode==="db") return withRetry(() => STORE.db.collection("contributi").doc(rec.id).set(JSON.parse(JSON.stringify(body))));
  CONTRIB.push(body); saveLocal("scrinium-contributi",CONTRIB); dataChanged();
}
async function removeContrib(id){
  if(STORE.mode==="db") return withRetry(() => STORE.db.collection("contributi").doc(id).delete());
  CONTRIB = CONTRIB.filter(c=>c.id!==id); saveLocal("scrinium-contributi",CONTRIB); dataChanged();
}
async function addLink(l){
  const body = {...l, creato:Date.now(), autoreId:STORE.myId};
  if(STORE.mode==="db") return withRetry(() => STORE.db.collection("collegamenti").doc(l.id).set(body));
  LINKS_USER.push(body); saveLocal("scrinium-collegamenti",LINKS_USER); dataChanged();
}
async function removeLink(id){
  if(STORE.mode==="db") return withRetry(() => STORE.db.collection("collegamenti").doc(id).delete());
  LINKS_USER = LINKS_USER.filter(l=>l.id!==id); saveLocal("scrinium-collegamenti",LINKS_USER); dataChanged();
}
async function fillNames(root){
  const els = $$("[data-uid]", root); if(!els.length) return;
  const ids = [...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];
  let ps = {}; if(STORE.user && ids.length){ try{ ps = await STORE.user.profiles(ids) || {} }catch(e){} }
  els.forEach(e => { const id = e.dataset.uid; e.textContent = id && id===STORE.myId ? "te" : ((ps[id] && ps[id].name) || (STORE.mode==="db" ? "un utente" : "te, in questo browser")); });
}
function storeStatusHTML(){
  if(STORE.mode==="db") return STORE.canWrite ? `Le schede e i collegamenti che aggiungi sono salvati nell’archivio condiviso e sono visibili a tutte le persone che consultano il catalogo.`
    : `Hai accesso in sola lettura all’archivio condiviso: puoi consultare le schede ma non aggiungerne.`;
  return `In questa visualizzazione l’archivio condiviso non è disponibile: le schede restano salvate solo in questo browser.`;
}

let dcTimer = null;
function dataChanged(){
  buildRecords();
  clearTimeout(dcTimer);
  dcTimer = setTimeout(() => {
    const page = (location.hash.slice(2).split(/[/?]/)[0]) || "home";
    if(page==="contribuisci"){ if(window.__drawMine) window.__drawMine(); const st=$("#storeStatus"); if(st) st.textContent = storeStatusHTML(); }
    else if(page==="catalogo"){ if($("#catBody")) updateCatalog(true); }
    else if(page==="record"){
      const id = decodeURIComponent(location.hash.split("/")[2]||"").split("?")[0], r = byId(id);
      if(!r || !$("#linksList")) { render(true); return; }
      drawLinksList(r);
      const rq = $("#rq"); if($("#reader") && (!rq || rq.value.trim().length<2)) $("#reader").innerHTML = readerBody(r,"");
    }
    else if(!$("#app").contains(document.activeElement) || document.activeElement===$("#app")) render(true);
  }, 60);
}

async function initRuntime(){
  if(!window.claude || typeof window.claude.use!=="function") return;
  claude.use("downloads").then(d => { STORE.downloads = d; $$(".dl-only").forEach(b => b.hidden = !d); }).catch(()=>{});
  let db = null, user = null;
  try{ [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); }catch(e){}
  if(!db) return;
  STORE.db = db; STORE.user = user;
  try{ STORE.myId = user ? await user.id() : null }catch(e){}
  try{ const c = user ? await user.can("data.write") : null; STORE.canWrite = c !== false }catch(e){}
  try{ STORE.isEditor = user ? await user.canEdit() : false }catch(e){}
  STORE.pending = {contrib: CONTRIB.slice(), links: LINKS_USER.slice()};
  CONTRIB = []; LINKS_USER = []; STORE.mode = "db";
  db.collection("contributi").onSnapshot(snap => {
    CONTRIB = snap.docs.map(d => cleanRecord(d.data(), d.id)).filter(Boolean).sort((a,b)=>a.creato-b.creato); dataChanged();
  }, () => {});
  db.collection("collegamenti").onSnapshot(snap => {
    LINKS_USER = snap.docs.map(d => cleanLink(d.data(), d.id)).filter(Boolean).sort((a,b)=>a.creato-b.creato); dataChanged();
  }, () => {});
  dataChanged();
}
async function publishPending(){
  const p = STORE.pending; if(!p) return;
  let ok = 0;
  try{
    for(const c of p.contrib){ const {contributo, ...rest} = c; await STORE.db.collection("contributi").doc(c.id).set(JSON.parse(JSON.stringify({...rest, autoreId:STORE.myId}))); ok++; }
    for(const l of p.links){ await STORE.db.collection("collegamenti").doc(l.id).set({...l, autoreId:STORE.myId}); ok++; }
    saveLocal("scrinium-contributi",[]); saveLocal("scrinium-collegamenti",[]); STORE.pending = {contrib:[],links:[]};
    toast(`${ok} elementi pubblicati nell’archivio condiviso`);
  }catch(e){ toast(writeErrorMsg(e)); }
  if(window.__drawMine) window.__drawMine();
}

async function saveFile(filename, data){
  if(!STORE.downloads){ toast("Il salvataggio di file non è disponibile qui: usa Copia"); return; }
  try{ await STORE.downloads.save({filename, data}); }
  catch(e){ if(e && e.code==="declined") return; toast(e && e.code==="rate_limited" ? "Un salvataggio è già in corso: attendi" : "Il file non è stato salvato: usa Copia"); }
}

/* avvio */
buildRecords();
render();
initRuntime();
</script>
